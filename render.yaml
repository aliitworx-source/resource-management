# A persistent disk requires a paid Render service. Review Render pricing before creating.
services:
  - type: web
    name: resource-management
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT 'app:create_app()'
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: APP_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_ADMIN_PASSWORD
        sync: false
    disk:
      name: resource-data
      mountPath: /var/data
      sizeGB: 1
